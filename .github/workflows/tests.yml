name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --project backend --extra dev --locked
      - run: uv pip install --python backend/.venv/bin/python --editable ./sdk
      - name: Python lint and type checks
        working-directory: backend
        run: |
          uv run ruff check --config pyproject.toml . ../sdk ../ui/e2e/server.py
          uv run pyright
      - name: Backend suite including PostgreSQL, S3 and Docker gates
        working-directory: backend
        env:
          OTEL_ENABLED: "false"
        run: uv run python scripts/test-live.py -- --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            backend/coverage.xml
            backend/test-results/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --project backend --extra dev --locked
      - run: npm ci
        working-directory: ui
      - name: Install all browser engines
        working-directory: ui
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Frontend lint and type checks
        working-directory: ui
        run: |
          npm run lint
          npm run typecheck
      - name: Production build, regression and browser tests
        working-directory: ui
        run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 14
