[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-research"
version = "0.1.0"
description = "External rollout collection for the AML research API"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aml-collect = "aml_research.collector:main"

[tool.setuptools.packages.find]
where = ["src"]
