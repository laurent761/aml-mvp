# Isolated local acceptance deployment. See docs/RESEARCH_INTEGRATION.md.
name: aml-research-smoke
x-environment: &environment
  DEPLOYMENT_ENVIRONMENT: test
  OTEL_ENABLED: "false"
  DATABASE_URL: postgresql+psycopg://postgres:${RESEARCH_SMOKE_DB_PASSWORD:?set smoke database password}@postgres:5432/research
  ARTIFACT_BACKEND: local
  ARTIFACT_ROOT: /app/var/artifacts
  RESEARCH_UPLOAD_ROOT: /app/var/uploads
  RESEARCH_OWNER_COST_LIMIT: "1000"
  CAPSULE_SUPERVISOR_URL: http://supervisor:8090
  CAPSULE_SUPERVISOR_TOKEN: ${RESEARCH_SMOKE_SUPERVISOR_TOKEN:?set smoke supervisor token}
x-storage: &storage
  - artifacts:/app/var/artifacts
  - uploads:/app/var/uploads
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${RESEARCH_SMOKE_DB_PASSWORD:?set smoke database password}
      POSTGRES_DB: research
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d research"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["database:/var/lib/postgresql/data"]
  migrate:
    image: ${RESEARCH_SMOKE_API_IMAGE:-adversarial-api:local}
    environment:
      <<: *environment
      SERVICE_ROLE: api
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  supervisor:
    image: ${RESEARCH_SMOKE_SUPERVISOR_IMAGE:-adversarial-capsule-supervisor:local}
    command: [adversarial-capsule-supervisor]
    environment:
      DEPLOYMENT_ENVIRONMENT: test
      SERVICE_ROLE: capsule-supervisor
      OTEL_ENABLED: "false"
      CAPSULE_SUPERVISOR_TOKEN: ${RESEARCH_SMOKE_SUPERVISOR_TOKEN}
      CAPABILITY_SIGNING_KEY: ${RESEARCH_SMOKE_SIGNING_KEY:?set smoke signing key}
      BLUE_GATEWAY_IMAGE: ${RESEARCH_SMOKE_BLUE_IMAGE:-blue-gateway:local}
      TARGET_MODEL_PROVIDER: disabled
    volumes: ["${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"]
    group_add: ["${DOCKER_GID:-0}"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: ${RESEARCH_SMOKE_API_IMAGE:-adversarial-api:local}
    command: [adversarial-api]
    environment:
      <<: *environment
      SERVICE_ROLE: api
      GUIDE_MODEL_BASE_URL: ${GUIDE_MODEL_BASE_URL:-https://api.openai.com/v1}
      GUIDE_MODEL_NAME: ${GUIDE_MODEL_NAME:-gpt-4.1-mini}
      GUIDE_MODEL_API_KEY: ${GUIDE_MODEL_API_KEY:-}
      GUIDE_MODEL_MAX_OUTPUT_TOKENS: ${GUIDE_MODEL_MAX_OUTPUT_TOKENS:-1800}
      GUIDE_MODEL_TOKEN_PARAMETER: ${GUIDE_MODEL_TOKEN_PARAMETER:-max_tokens}
      GUIDE_MODEL_JSON_MODE: ${GUIDE_MODEL_JSON_MODE:-true}
      GUIDE_MODEL_TIMEOUT_SECONDS: ${GUIDE_MODEL_TIMEOUT_SECONDS:-45}
      GUIDE_MODEL_MAX_CONCURRENCY: ${GUIDE_MODEL_MAX_CONCURRENCY:-2}
      GUIDE_REQUESTS_PER_MINUTE: ${GUIDE_REQUESTS_PER_MINUTE:-20}
      RESEARCH_AUTH_REQUIRED: "true"
      RESEARCH_AUTH_TOKENS: ${RESEARCH_SMOKE_AUTH_TOKENS:?set hashed research principals}
    ports: ["127.0.0.1:${RESEARCH_SMOKE_API_PORT:-18000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: *storage
    depends_on:
      migrate: {condition: service_completed_successfully}
      supervisor: {condition: service_healthy}
  worker:
    image: ${RESEARCH_SMOKE_WORKER_IMAGE:-adversarial-worker:local}
    command: [adversarial-worker]
    environment:
      <<: *environment
      SERVICE_ROLE: worker
      WORKER_POLL_SECONDS: "0.2"
      MAX_WORKER_CONCURRENCY: "4"
    volumes: *storage
    depends_on:
      migrate: {condition: service_completed_successfully}
      supervisor: {condition: service_healthy}
  ui:
    image: ${RESEARCH_SMOKE_UI_IMAGE:-adversarial-ui:local}
    environment:
      BACKEND_API_URL: http://api:8000
    ports: ["127.0.0.1:${RESEARCH_SMOKE_UI_PORT:-13000}:3000"]
    depends_on: [api]
volumes:
  database:
  artifacts:
  uploads:
