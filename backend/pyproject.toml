[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adversarial-agent-mvp-backend"
version = "0.1.0"
description = "Black-box adversarial agent safety lab backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=19,<24",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "pyright>=1.1,<2",
  "ruff>=0.9,<1",
]

[dependency-groups]
mlflow-server = [
  "mlflow==3.1.4",
]

[project.scripts]
adversarial-api = "adversarial_agent_mvp.apps.api:run"
adversarial-worker = "adversarial_agent_mvp.apps.worker:run"
adversarial-blue-gateway = "adversarial_agent_mvp.apps.blue_gateway:run"
adversarial-capsule-supervisor = "adversarial_agent_mvp.apps.capsule_supervisor:run"
adversarial-bundle = "adversarial_agent_mvp.bundle_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adversarial_agent_mvp", "src/aml_reference_target", "src/aml_target_protocol"]

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.hypothesis",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/*.db",
  "/dist",
  "/var",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=adversarial_agent_mvp --cov=aml_reference_target --cov=aml_target_protocol --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "containment: validates fail-closed isolation controls",
  "integration: validates component integration",
  "e2e: validates a complete campaign lifecycle",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
